<!DOCTYPE html>
<html lang="fr">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Camera Capture</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            display: none;
        }

        .active {
            display: block;
        }

        video,
        canvas {
            width: 100%;
            max-width: 400px;
            border: 2px solid blue;
        }

        button {
            margin: 10px;
            padding: 10px;
        }
    </style>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    </head>

    <body>
        <header>
            <nav
                class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
                <div class="container">
                    <div class="d-flex w-100 justify-content-between">
                        <div>
                            <a class="nav-link d-inline"
                                href="../index.html">Home</a>
                            <a class="nav-link d-inline"
                                href="amis.html">Friends</a>
                            <a class="nav-link d-inline"
                                href="ajouterAmis.html">Add_Friends</a>
                            <a class="nav-link d-inline"
                                href="admin.html">Admin</a>
                            <a class="nav-link d-inline" href="addPost.html">Add
                                Post</a>
                            <a class="nav-link d-inline" href="camera.html">Add
                                Post Caméra</a>
                        </div>
                        <div>
                            <a class="nav-link d-inline"
                                href="connexion.html">Login</a>
                            <a class="nav-link d-inline"
                                href="creation.html">Sign up</a>
                        </div>
                    </div>
                </div>
            </nav>

            <div class="py-4 text-center">
                <div class="container">
                    <h1>
                        <span class="badge bg-dark fs-4">MI</span>
                        <span class="ms-2">Créer un Post</span>
                    </h1>
                </div>
            </div>
        </header>

        <main>
            <div id="cameraContainer" class="container active">
                <video id="video" autoplay></video>
                <br>
                <button id="switchCamera">Changer camera</button>
                <button id="takePhoto">Prendre photo</button>
            </div>

            <div id="previewContainer" class="container">
                <canvas id="canvas"></canvas>
                <br>
                <button id="cancel">Annuler</button>
                <button id="post">Créer le post</button>
            </div>
        </main>

        <script>
        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let cameraContainer = document.getElementById('cameraContainer');
        let previewContainer = document.getElementById('previewContainer');
        let stream = null;
        let useFrontCamera = true;

        async function startCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: useFrontCamera ? 'user' : 'environment' }
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Erreur d'accès à la caméra");
            }
        }

        document.getElementById('switchCamera').addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        });

        document.getElementById('takePhoto').addEventListener('click', () => {
            let context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            cameraContainer.classList.remove('active');
            previewContainer.classList.add('active');
        });

        document.getElementById('cancel').addEventListener('click', () => {
            previewContainer.classList.remove('active');
            cameraContainer.classList.add('active');
        });

        document.getElementById('post').addEventListener('click', async () => {
            const token = sessionStorage.getItem("token");
            const imageData = canvas.toDataURL('image/png'); // base64 image

            const response = await fetch('https://10.5.57.106/GitHub/MiniInstagram/BackEnd/API/squelletePhoto.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    user_token: token,
                    photo_url: imageData
                })
            });

            const result = await response.json();
            if (result.success) {
                alert('Post créé avec succès !');
            } else {
                alert('Erreur : ' + result.message);
            }
        });
 
        startCamera();
    </script>
    </body>

</html>
